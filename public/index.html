<!DOCTYPE html>
<html>

<head>
    <title>Football Leagues</title>
</head>

<style>
    /* styles.css */
body {
   font-family: Arial, sans-serif;
   padding: 20px;
}
table {
   width: 80%;
   margin: 0 auto;
   border-collapse: collapse;
   text-align: left;
}
th, td {
   border: 1px solid #ddd;
   padding: 10px;
}
th {
   background-color: #f4f4f4;
   font-weight: bold;
}
tr:nth-child(even) {
   background-color: #f9f9f9; /* Zebra striping */
}
tr:hover {
   background-color: #f1f1f1; /* Hover effect */
}
#title{
    text-align: center;
}
</style>

<body>

    <h1 id="title">Live Football Leagues</h1>

    <table id="table"> 
        <thead>
            <tr>
                <th>Name</th>
                <th>Country</th>
                <th>Type</th>
                <th>Code</th>
            </tr>
        </thead>
    
        <tbody id="tableBody"></tbody>
    </table>

    <h1 id="title">Premier League Matches</h1>
    
    <table id="table">
        <thead >
            <tr>
                <th>Home</th>
                <th>Away</th>
                <th>Home Goals</th>
                <th>Away Goals</th>
                <th>Status</th>
            </tr>
        </thead>
    
        <tbody id="matchesTable">
        </tbody>
    </table>

    <script src="app.js"></script>

</body>

</html>
